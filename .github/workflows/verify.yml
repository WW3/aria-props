name: Validate ARIA Dataset

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run dataset checks
        run: |
          npm run check:dataset
          npm run verify
          npm run test:smoke
          npm run build:release
