name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate dataset
        run: npm run data:check
      - name: Type-check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build (single-file)
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: aria-props-dist
          path: dist/index.html
